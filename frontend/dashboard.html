<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogSpace - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">BlogSpace</div>

        <nav>
            <a href="index.html">Home</a>
            <button type="button" id="logoutBtn" class="nav-btn">
                Logout
            </button>
        </nav>
    </header>

    <main class="dashboard">

        <section class="dashboard-header">
            <div>
                <p class="tagline">YOUR SPACE</p>

                <h1>
                    Welcome,
                    <span id="userName">Writer</span>
                </h1>

                <p>Create and manage your stories.</p>
            </div>
        </section>


        <!-- Create / Edit Post -->

        <section class="editor-section">

            <div class="editor-card">

                <p class="tagline">CREATE POST</p>

                <h2 id="formTitle">
                    Write a New Story
                </h2>

                <form id="postForm">

                    <div class="form-group">

                        <label for="title">
                            Title
                        </label>

                        <input type="text" id="title" placeholder="Enter your post title" required>

                    </div>


                    <div class="form-group">

                        <label for="content">
                            Content
                        </label>

                        <textarea id="content" rows="8" placeholder="Write your story..." required></textarea>

                    </div>


                    <div class="editor-actions">

                        <button type="submit" class="btn" id="submitBtn">
                            Publish Post
                        </button>


                        <button type="button" class="cancel-btn" id="cancelBtn" style="display: none;">
                            Cancel
                        </button>

                    </div>


                    <p id="message" class="form-message"></p>

                </form>

            </div>

        </section>


        <!-- My Posts -->

        <section class="my-posts">

            <div class="section-heading">

                <p class="tagline">
                    MANAGE CONTENT
                </p>

                <h2>
                    My Posts
                </h2>

            </div>


            <div id="myPostsContainer" class="posts-grid">

                <p class="loading">
                    Loading your posts...
                </p>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 BlogSpace. All rights reserved.
        </p>

    </footer>


    <script>

        const API_URL = "http://localhost:3000";

        const token =
            localStorage.getItem("token");

        const user =
            JSON.parse(
                localStorage.getItem("user")
            );


        // ==============================
        // CHECK LOGIN
        // ==============================

        if (!token || !user) {

            window.location.href =
                "login.html";

        }


        // ==============================
        // USER NAME
        // ==============================

        document.getElementById(
            "userName"
        ).textContent = user.name;


        // ==============================
        // ELEMENTS
        // ==============================

        const postForm =
            document.getElementById("postForm");

        const titleInput =
            document.getElementById("title");

        const contentInput =
            document.getElementById("content");

        const message =
            document.getElementById("message");

        const myPostsContainer =
            document.getElementById(
                "myPostsContainer"
            );

        const submitBtn =
            document.getElementById(
                "submitBtn"
            );

        const cancelBtn =
            document.getElementById(
                "cancelBtn"
            );

        const formTitle =
            document.getElementById(
                "formTitle"
            );

        const logoutBtn =
            document.getElementById(
                "logoutBtn"
            );


        // ==============================
        // EDITING POST
        // ==============================

        let editingPostId = null;


        // ==============================
        // LOAD MY POSTS
        // ==============================

        async function loadMyPosts() {

            try {

                const response =
                    await fetch(
                        `${API_URL}/posts`
                    );


                const posts =
                    await response.json();


                const myPosts =
                    posts.filter(
                        post =>
                            post.userId &&
                            post.userId._id === user.id
                    );


                if (!myPosts.length) {

                    myPostsContainer.innerHTML = `
                    <div class="empty-state">

                        <h3>
                            No posts yet
                        </h3>

                        <p>
                            Start by writing
                            your first story.
                        </p>

                    </div>
                `;

                    return;
                }


                myPostsContainer.innerHTML = "";


                myPosts.forEach(post => {

                    const article =
                        document.createElement(
                            "article"
                        );


                    article.className =
                        "post-card";


                    const date =
                        new Date(
                            post.createdAt
                        ).toLocaleDateString();


                    const shortContent =
                        post.content.length > 140
                            ? post.content.substring(
                                0,
                                140
                            ) + "..."
                            : post.content;


                    article.innerHTML = `

                    <div class="post-meta">
                        ${date}
                    </div>

                    <h3>
                        ${escapeHTML(
                        post.title
                    )}
                    </h3>

                    <p>
                        ${escapeHTML(
                        shortContent
                    )}
                    </p>

                    <div class="post-actions">

                        <button
                            type="button"
                            class="edit-btn"
                        >
                            Edit
                        </button>

                        <button
                            type="button"
                            class="delete-btn"
                        >
                            Delete
                        </button>

                    </div>

                `;


                    // Edit

                    const editButton =
                        article.querySelector(
                            ".edit-btn"
                        );


                    editButton.addEventListener(
                        "click",
                        () => {

                            editPost(
                                post._id,
                                post.title,
                                post.content
                            );

                        }
                    );


                    // Delete

                    const deleteButton =
                        article.querySelector(
                            ".delete-btn"
                        );


                    deleteButton.addEventListener(
                        "click",
                        () => {

                            deletePost(
                                post._id
                            );

                        }
                    );


                    myPostsContainer.appendChild(
                        article
                    );

                });


            } catch (error) {

                console.error(error);


                myPostsContainer.innerHTML = `
                <div class="empty-state">

                    <h3>
                        Unable to load posts
                    </h3>

                    <p>
                        Please make sure the
                        backend server is running.
                    </p>

                </div>
            `;

            }

        }


        // ==============================
        // CREATE / UPDATE POST
        // ==============================

        postForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const title =
                    titleInput.value.trim();


                const content =
                    contentInput.value.trim();


                if (!title || !content) {

                    message.textContent =
                        "Title and content are required.";

                    message.className =
                        "form-message error";

                    return;

                }


                const url =
                    editingPostId
                        ? `${API_URL}/posts/${editingPostId}`
                        : `${API_URL}/posts`;


                const method =
                    editingPostId
                        ? "PUT"
                        : "POST";


                try {

                    const response =
                        await fetch(
                            url,
                            {

                                method: method,

                                headers: {

                                    "Content-Type":
                                        "application/json",

                                    "Authorization":
                                        `Bearer ${token}`

                                },

                                body:
                                    JSON.stringify({

                                        title: title,

                                        content: content

                                    })

                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        message.textContent =
                            data.message ||
                            "Something went wrong.";

                        message.className =
                            "form-message error";

                        return;

                    }


                    // Success message

                    if (editingPostId) {

                        message.textContent =
                            "Post updated successfully!";

                    } else {

                        message.textContent =
                            "Post published successfully!";

                    }


                    message.className =
                        "form-message success";


                    // Reset editor

                    editingPostId = null;

                    titleInput.value = "";

                    contentInput.value = "";

                    formTitle.textContent =
                        "Write a New Story";

                    submitBtn.textContent =
                        "Publish Post";

                    cancelBtn.style.display =
                        "none";


                    await loadMyPosts();


                } catch (error) {

                    console.error(error);


                    message.textContent =
                        "Unable to connect to server.";

                    message.className =
                        "form-message error";

                }

            }
        );


        // ==============================
        // EDIT POST
        // ==============================

        function editPost(
            id,
            title,
            content
        ) {

            editingPostId = id;


            titleInput.value =
                title;


            contentInput.value =
                content;


            formTitle.textContent =
                "Edit Your Story";


            submitBtn.textContent =
                "Update Post";


            cancelBtn.style.display =
                "inline-block";


            message.textContent =
                "";

            message.className =
                "form-message";


            window.scrollTo({

                top: 0,

                behavior: "smooth"

            });

        }


        // ==============================
        // CANCEL EDIT
        // ==============================

        cancelBtn.addEventListener(
            "click",
            () => {

                resetForm();

            }
        );


        function resetForm() {

            editingPostId = null;


            titleInput.value =
                "";

            contentInput.value =
                "";


            formTitle.textContent =
                "Write a New Story";


            submitBtn.textContent =
                "Publish Post";


            cancelBtn.style.display =
                "none";


            message.textContent =
                "";

            message.className =
                "form-message";

        }


        // ==============================
        // DELETE POST
        // ==============================

        async function deletePost(id) {

            const confirmed =
                confirm(
                    "Are you sure you want to delete this post?"
                );


            if (!confirmed) {

                return;

            }


            try {

                const response =
                    await fetch(
                        `${API_URL}/posts/${id}`,
                        {

                            method: "DELETE",

                            headers: {

                                "Authorization":
                                    `Bearer ${token}`

                            }

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    message.textContent =
                        data.message ||
                        "Unable to delete post.";

                    message.className =
                        "form-message error";

                    return;

                }


                message.textContent =
                    "Post deleted successfully!";


                message.className =
                    "form-message success";


                await loadMyPosts();


            } catch (error) {

                console.error(error);


                message.textContent =
                    "Unable to connect to server.";

                message.className =
                    "form-message error";

            }

        }


        // ==============================
        // LOGOUT
        // ==============================

        logoutBtn.addEventListener(
            "click",
            () => {

                sessionStorage.setItem(
                    "logoutMessage",
                    "Logged out successfully!"
                );


                localStorage.removeItem(
                    "token"
                );


                localStorage.removeItem(
                    "user"
                );


                window.location.href =
                    "login.html";

            }
        );


        // ==============================
        // HTML ESCAPE
        // ==============================

        function escapeHTML(value) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                value;


            return div.innerHTML;

        }


        // ==============================
        // INITIAL LOAD
        // ==============================

        loadMyPosts();

    </script>

</body>

</html>
